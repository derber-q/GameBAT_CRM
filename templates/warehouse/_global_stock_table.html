<div class="table-scroll">
  <table class="global-stock-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Артикул</th>
        <th>Название</th>
        <th class="numeric-center">Всего на складах</th>
        <th class="numeric-center">На реализации</th>
        <th class="numeric-center">В перемещении</th>
      </tr>
    </thead>
    <tbody>
      {% for row in group_rows %}
        <tr>
          <td class="mono">{{ row.id }}</td>
          <td class="mono">{{ row.sku }}</td>
          <td class="strong">{{ row.name }}</td>
          <td class="numeric-center stock-number">{{ row.warehouse_total }}</td>
          <td class="numeric-center">{{ row.consignment }}</td>
          <td class="numeric-center">{{ row.transit }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
