{% load l10n %}
<section class="consignment-product-group collapsible-section">
  <button class="section-heading section-toggle consignment-group-toggle" type="button" aria-expanded="true" aria-controls="consignment-{{ sales_platform.pk }}-{{ product_kind }}-{{ group.pk }}" data-collapse-toggle>
    <span class="section-title"><span class="section-name">{{ group.name }}</span></span>
    <span class="section-heading-meta"><span class="count" data-group-count>{{ rows|length }} поз.</span><span class="collapse-indicator" aria-hidden="true">▼</span></span>
  </button>
  <div id="consignment-{{ sales_platform.pk }}-{{ product_kind }}-{{ group.pk }}" class="collapsible-content table-scroll">
    <table class="consignment-stock-table">
      <thead><tr><th>Название</th><th>Артикул</th><th>Склад-источник</th><th class="numeric">Количество</th><th class="numeric">Себестоимость</th><th class="numeric">Вознаграждение / ед.</th><th class="numeric">Всего к получению</th>{% if can_change_reward %}<th>Изменить вознаграждение</th>{% endif %}{% if can_record_sale or can_return %}<th>Действия</th>{% endif %}</tr></thead>
      <tbody>{% for row in rows %}{% include "consignment/_stock_row.html" %}{% endfor %}</tbody>
    </table>
  </div>
</section>
