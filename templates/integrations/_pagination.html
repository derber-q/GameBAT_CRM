{% if page.has_other_pages %}<nav class="pagination" aria-label="Страницы"><span>Страница {{ page.number }} из {{ page.paginator.num_pages }}</span>{% if page.has_previous %}<a class="button button-secondary button-small" href="?q={{ query|urlencode }}&{{ parameter }}={{ page.previous_page_number }}">Назад</a>{% endif %}{% if page.has_next %}<a class="button button-secondary button-small" href="?q={{ query|urlencode }}&{{ parameter }}={{ page.next_page_number }}">Вперёд</a>{% endif %}</nav>{% endif %}
