{% load l10n %}
<td data-scope-cell="{{ region.scope }}">
{% if can_record %}<form method="post" action="{% url 'pricing:avito_check_found_price' %}" data-found-price-form data-kind="{{ row.kind }}" data-product-id="{{ row.product.pk|unlocalize }}" data-scope="{{ region.scope }}">
{% csrf_token %}<input type="hidden" name="kind" value="{{ row.kind }}"><input type="hidden" name="product_id" value="{{ row.product.pk|unlocalize }}"><input type="hidden" name="scope" value="{{ region.scope }}"><input type="hidden" name="expected_recorded_at" value="{{ region.version }}">
<input class="compact-input" aria-label="Найденная цена {{ region.label }}: {{ row.product.name }}" name="price" type="number" min="0.01" step="0.01" required value="{{ region.found.price|default_if_none:''|unlocalize }}"><button class="table-action" type="submit">Сохранить</button><span class="muted" role="status" data-save-status></span></form>{% else %}{{ region.found.price|default_if_none:'—' }}{% endif %}
<div class="avito-found-date" data-found-date>{{ region.found.recorded_at|date:'d.m.Y H:i'|default:'—' }}</div>
<a class="button button-secondary avito-manual-search" href="{{ region.manual_url }}"{% if can_record %} data-avito-manual-product="{{ row.product.pk|unlocalize }}" data-kind="{{ row.kind }}" data-scope="{{ region.scope }}"{% endif %} target="_blank" rel="noopener noreferrer">Поиск · {% if region.scope == 'russia' %}РФ{% else %}Ростов{% endif %}</a>
</td>
