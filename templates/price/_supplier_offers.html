{% load l10n %}
<div class="procurement-supplier-offers" aria-label="Цены поставщиков: {{ item.product_name_snapshot }}">{% for offer in item.supplier_choices %}{% if not forloop.first %}<span class="muted" aria-hidden="true">\</span>{% endif %}<span class="procurement-supplier-offer{% if offer.selected %} is-selected{% endif %}{% if offer.excluded %} is-excluded{% endif %}{% if offer.is_expensive %} is-expensive{% endif %}" data-supplier-offer data-supplier-id="{{ offer.supplier.pk }}" aria-current="{{ offer.selected|yesno:'true,false' }}" data-price-aed="{{ offer.price_aed|unlocalize }}" data-original-price-aed="{{ offer.original_price_aed|unlocalize }}" data-supplier-letter="{{ offer.supplier.letter }}" title="{% if offer.manual %}Ручная цена. Исходное предложение: {{ offer.original_price_label }} AED{% endif %}{% if offer.excluded %} · Поставщик исключён из подбора товара{% endif %}">{{ offer.supplier.letter }}–{{ offer.price_label }}{% if offer.manual %} ✎{% endif %}</span>{% endfor %}</div>
