{% load static %}
{% if nav.market_notifications %}
<aside class="market-alert-panel notification-state" id="market-order-alerts" data-feed-url="{% url 'sales:market_notifications' %}" data-sound-url="{% static 'audio/yandex-order-applepay.mp3' %}?v=20261116-1" data-pending-url="{% url 'sales:market_pending' %}">
  <form data-market-csrf hidden>{% csrf_token %}</form>
  <span class="notification-audio-status" role="status" aria-live="polite" data-market-audio-status>Звук ещё не включён на этой странице.</span>
  <span role="status" aria-live="polite" data-market-feed-status></span>
</aside>
{% endif %}
{% if nav.avito_notifications %}
<aside class="market-alert-panel notification-state" data-avito-sound data-sound-url="{% static 'audio/avito-action-notification.mp3' %}?v=20261116-1">
  <span class="notification-audio-status" role="status" aria-live="polite" data-avito-sound-status>Звук новых действий Avito и напоминания каждые 5 минут до их выполнения.</span>
</aside>
{% endif %}
