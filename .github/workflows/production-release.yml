name: Подготовка ручного production-релиза
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prepare-production-release
  cancel-in-progress: false
jobs:
  announce:
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Отметить коммит как ожидающий проверки
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/derber-q/GameBAT_CRM/statuses/$GITHUB_SHA" -f state=pending -f context=resource/deployment -f description='Checks are running' > /dev/null
  sqlite:
    needs: announce
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt -r deploy/updater/test-requirements.txt
      - run: python -m deployment.ci_checks
      - if: runner.os == 'Linux'
        run: python -m pip_audit -r requirements.txt -r deploy/updater/requirements.txt
  postgres:
    needs: announce
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: resource_ci
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: resource_ci
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt -r deploy/updater/requirements.txt -r deploy/updater/test-requirements.txt
      - run: python -m deployment.ci_checks --postgres
      - run: python -m deployment.production_gate
  browser:
    needs: announce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt -r deploy/updater/test-requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: mkdir -p outputs
      - run: python manage.py test core.updates_browser_checks core.navigation_browser_checks integrations.worker_browser_checks sales.market_scan_browser_checks sales.print_agent_browser_checks --settings=deployment.ci_browser_settings --noinput
  publish:
    needs: [sqlite, postgres, browser]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      statuses: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - id: schema
        run: echo "sha=$(python -m deployment.schema)" >> "$GITHUB_OUTPUT"
      - name: Контекст образа только из опубликованных исходников
        run: |
          mkdir -p /tmp/resource-build
          git archive HEAD | tar -x -C /tmp/resource-build
      - uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        id: image
        with:
          context: /tmp/resource-build
          file: /tmp/resource-build/deploy/updater/Dockerfile
          push: true
          tags: ghcr.io/derber-q/gamebat_crm:${{ github.sha }}
          build-args: |
            RELEASE_SHA=${{ github.sha }}
            SCHEMA_SHA=${{ steps.schema.outputs.sha }}
      - name: Сохранить digest образа для проверенного коммита
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          python -c "import json,os; print(json.dumps({'state':'success','context':'resource/deployment','description':os.environ['RELEASE_DIGEST']}))" > /tmp/resource-status.json
          gh api --method POST "repos/derber-q/GameBAT_CRM/statuses/$GITHUB_SHA" --input /tmp/resource-status.json
  failure:
    needs: [announce, sqlite, postgres, browser, publish]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/derber-q/GameBAT_CRM/statuses/$GITHUB_SHA" -f state=failure -f context=resource/deployment -f description='Release checks did not pass' > /dev/null
