worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    # Не журналируем query string, формы, cookies и пароли учебных пользователей.
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 32m;
    upstream local_test { server crm-test:8001; }
    server {
        listen 8080;
        location / {
            # Фиксированный upstream: URL/Host клиента не выбирают адрес назначения.
            proxy_pass http://local_test;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
            proxy_connect_timeout 3s;
            proxy_read_timeout 60s;
        }
    }
}
